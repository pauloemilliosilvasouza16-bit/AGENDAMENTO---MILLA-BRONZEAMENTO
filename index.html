<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MILA Bronzeamento - Agendamento</title>

    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

    <header class="topo">

        <div class="logo">
            MILA
            <span>Bronzeamento</span>
        </div>

    </header>


    <main class="container">

        <div class="card">

            <h1>Agende seu horário</h1>

            <p class="subtitulo">
                Escolha o serviço, a data e o horário
            </p>


            <label>1. Escolha o serviço</label>

            <select id="servico">

                <option value="Bronzeamento">
                    Bronzeamento
                </option>

            </select>


            <label>2. Escolha a data</label>

            <input
                type="date"
                id="data"
                onchange="carregarHorarios()"
            >


            <label>3. Escolha o horário</label>

            <select
                id="horario"
                disabled
            >

                <option value="">
                    Selecione primeiro a data
                </option>

            </select>


            <button onclick="continuar()">
                Continuar
            </button>


            <div class="seguranca">
                🔒 Seus dados estão seguros conosco.
            </div>

        </div>

    </main>


    <footer>
        © 2026 Mila Bronzeamento. Todos os direitos reservados.
    </footer>


    <script src="script.js"></script>

</body>

</html>
