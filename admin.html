<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MILLA Bronzeamento - Painel</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #fff9f7;
        }

        .admin-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .admin-titulo {
            color: #3b2929;
        }

        .admin-titulo span {
            display: block;
            color: #9d5b62;
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .admin-titulo h1 {
            margin: 0;
            font-size: 32px;
        }

        .admin-data {
            background: #fff8f5;
            border: 1px solid #f2ded9;
            padding: 12px 18px;
            border-radius: 14px;
            color: #695555;
            font-size: 14px;
        }

        /* =========================
           ABAS
        ========================= */

        .abas-admin {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            border-bottom: 1px solid #ead8d4;
            padding-bottom: 10px;
        }

        .aba-admin {
            border: none;
            background: transparent;
            color: #806f6f;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .aba-admin.ativa {
            background: #a94758;
            color: white;
        }

        .conteudo-aba {
            display: none;
        }

        .conteudo-aba.ativo {
            display: block;
        }

        /* =========================
           RESUMO
        ========================= */

        .resumo-admin {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .resumo-card {
            background: white;
            border: 1px solid #f2e1dd;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(80, 40, 40, 0.06);
        }

        .resumo-card small {
            display: block;
            color: #806f6f;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .resumo-card strong {
            display: block;
            color: #3b2929;
            font-size: 30px;
        }

        .resumo-card .detalhe {
            color: #9d5b62;
            font-size: 12px;
            margin-top: 5px;
        }

        /* =========================
           CABEÇALHO
        ========================= */

        .agenda-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        .agenda-header h2 {
            margin: 0;
            color: #3b2929;
            font-size: 26px;
        }

        .agenda-header p {
            margin: 5px 0 0;
            color: #806f6f;
            font-size: 14px;
        }

        /* =========================
           AGENDA
        ========================= */

        .grupo-data {
            margin-bottom: 30px;
        }

        .titulo-data {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .titulo-data h3 {
            margin: 0;
            color: #3b2929;
            font-size: 19px;
        }

        .titulo-data span {
            background: #9d5b62;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .lista-admin {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .agendamento-admin {
            background: white;
            border: 1px solid #f2e1dd;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(80, 40, 40, 0.06);
        }

        .agendamento-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 16px;
        }

        .cliente-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cliente-icone {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #f9e5df;
            color: #9d5b62;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .cliente-info h3 {
            margin: 0;
            color: #3b2929;
            font-size: 18px;
        }

        .cliente-info small {
            color: #806f6f;
            font-size: 13px;
        }

        .status {
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: #e8f7ec;
            color: #287a3d;
        }

        .status-cancelado {
            background: #ffe8e8;
            color: #a33;
        }

        .dados-agendamento {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .dado {
            background: #fff9f7;
            border-radius: 11px;
            padding: 12px;
        }

        .dado strong {
            display: block;
            color: #9d5b62;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .dado span {
            color: #403333;
            font-size: 14px;
        }

        .acoes-agendamento {
            margin-top: 15px;
            display: flex;
            justify-content: flex-end;
        }

        .btn-cancelar {
            border: none;
            border-radius: 22px;
            padding: 10px 18px;
            background: #a94758;
            color: white;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cancelar:hover {
            opacity: .9;
        }

        /* =========================
           DISPONIBILIDADE
        ========================= */

        .disponibilidade-box {
            background: white;
            border: 1px solid #f2e1dd;
            border-radius: 20px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 8px 25px rgba(80, 40, 40, .06);
        }

        .disponibilidade-box h2 {
            margin: 0;
            color: #3b2929;
        }

        .disponibilidade-box p {
            color: #806f6f;
            font-size: 14px;
        }

        .campo-data {
            margin-top: 20px;
        }

        .campo-data label {
            display: block;
            color: #4a3838;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .campo-data input {
            width: 100%;
            max-width: 300px;
            padding: 13px;
            border: 1px solid #e4d3cf;
            border-radius: 10px;
            font-size: 15px;
            background: #fff;
        }

        .horarios-admin {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .horario-card {
            border: 1px solid #ead8d4;
            border-radius: 16px;
            padding: 18px;
            background: #fff9f7;
        }

        .horario-card.disponivel {
            border-color: #cfe8d5;
            background: #f7fcf8;
        }

        .horario-card.lotado {
            border-color: #f0cccc;
            background: #fff5f5;
        }

        .horario-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .horario {
            font-size: 22px;
            font-weight: bold;
            color: #3b2929;
        }

        .bolinha {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #45a95d;
        }

        .lotado .bolinha {
            background: #c44747;
        }

        .vagas {
            margin-top: 8px;
            color: #806f6f;
            font-size: 13px;
        }

        .btn-novo {
            width: 100%;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            padding: 11px;
            background: #a94758;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-novo:disabled {
            background: #cdbfc0;
            cursor: not-allowed;
        }

        /* =========================
           FORMULÁRIO
        ========================= */

        .formulario-manual {
            display: none;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #ead8d4;
        }

        .formulario-manual.aberto {
            display: block;
        }

        .formulario-manual h3 {
            margin-top: 0;
            color: #3b2929;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            margin-bottom: 7px;
            color: #4a3838;
            font-size: 13px;
            font-weight: bold;
        }

        .campo input,
        .campo select {
            width: 100%;
            padding: 13px;
            border: 1px solid #e4d3cf;
            border-radius: 10px;
            font-size: 15px;
            background: white;
        }

        .campo-full {
            grid-column: 1 / -1;
        }

        .acoes-form {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-salvar {
            flex: 1;
            border: none;
            border-radius: 12px;
            padding: 14px;
            background: #a94758;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-fechar {
            flex: 1;
            border: 1px solid #d9c6c2;
            border-radius: 12px;
            padding: 14px;
            background: white;
            color: #695555;
            font-weight: bold;
            cursor: pointer;
        }

        .mensagem-form {
            display: none;
            margin-top: 15px;
            padding: 13px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
        }

        .mensagem-form.sucesso {
            display: block;
            background: #e8f7ec;
            color: #287a3d;
        }

        .mensagem-form.erro {
            display: block;
            background: #fff0f0;
            color: #a33;
        }

        /* =========================
           ESTADOS
        ========================= */

        .carregando {
            text-align: center;
            padding: 40px;
            color: #806f6f;
        }

        .erro-admin {
            text-align: center;
            padding: 30px;
            color: #a33;
            background: #fff1f1;
            border-radius: 15px;
        }

        .vazio-admin {
            text-align: center;
            padding: 45px 20px;
            background: white;
            border: 1px solid #f2e1dd;
            border-radius: 18px;
            color: #806f6f;
        }

        .vazio-admin strong {
            display: block;
            color: #3b2929;
            font-size: 18px;
            margin-bottom: 7px;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 900px) {

            .resumo-admin {
                grid-template-columns: repeat(2, 1fr);
            }

            .dados-agendamento {
                grid-template-columns: repeat(2, 1fr);
            }

            .horarios-admin {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {

            .admin-topo {
                flex-direction: column;
                align-items: flex-start;
            }

            .resumo-admin {
                grid-template-columns: 1fr 1fr;
            }

            .dados-agendamento {
                grid-template-columns: 1fr 1fr;
            }

            .horarios-admin {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .campo-full {
                grid-column: auto;
            }

            .agendamento-topo {
                align-items: flex-start;
            }

            .abas-admin {
                overflow-x: auto;
            }

            .aba-admin {
                white-space: nowrap;
            }
        }

        @media (max-width: 420px) {

            .resumo-admin {
                grid-template-columns: 1fr;
            }

            .dados-agendamento {
                grid-template-columns: 1fr;
            }

            .acoes-form {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header class="topo">

        <div class="logo">
            MILLA
            <span>Bronzeamento</span>
        </div>

        <div>
            Painel Administrativo
        </div>

    </header>


    <main class="container">

        <!-- CABEÇALHO -->

        <div class="admin-topo">

            <div class="admin-titulo">

                <span>ADMINISTRAÇÃO</span>

                <h1>Agenda</h1>

            </div>

            <div class="admin-data" id="dataAtual">
                Carregando data...
            </div>

        </div>


        <!-- ABAS -->

        <div class="abas-admin">

            <button
                class="aba-admin ativa"
                id="abaAgenda"
                onclick="mostrarAba('agenda')"
            >
                📋 Agenda
            </button>

            <button
                class="aba-admin"
                id="abaDisponibilidade"
                onclick="mostrarAba('disponibilidade')"
            >
                🕐 Disponibilidade
            </button>

        </div>


        <!-- =========================
             ABA AGENDA
        ========================= -->

        <section
            id="conteudoAgenda"
            class="conteudo-aba ativo"
        >

            <div class="resumo-admin">

                <div class="resumo-card">

                    <small>Agendamentos hoje</small>

                    <strong id="totalHoje">0</strong>

                    <div class="detalhe">
                        atendimentos
                    </div>

                </div>


                <div class="resumo-card">

                    <small>Confirm
