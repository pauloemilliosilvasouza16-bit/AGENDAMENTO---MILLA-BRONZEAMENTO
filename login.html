<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MILLA Bronzeamento - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f8f5f6;
        }

        .login {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;
            color: #9d3f4f;
            letter-spacing: 4px;
        }

        .logo span {
            color: #777;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #a94758;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #erro {
            display: none;
            margin-top: 15px;
            text-align: center;
            color: #b00020;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login">

        <div class="logo">
            <h1>MILLA</h1>
            <span>Bronzeamento</span>
        </div>

        <h2>Painel Administrativo</h2>

        <form id="loginForm">

            <label for="usuario">Usuário</label>

            <input
                type="text"
                id="usuario"
                autocomplete="username"
                required
            >

            <label for="senha">Senha</label>

            <input
                type="password"
                id="senha"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <div id="erro">
            Usuário ou senha incorretos.
        </div>

    </div>

    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const usuario =
                    document.getElementById("usuario").value;

                const senha =
                    document.getElementById("senha").value;

                const erro =
                    document.getElementById("erro");

                erro.style.display = "none";

                try {

                    const resposta = await fetch("/api/admin");

if (resposta.status === 401) {
    window.location.href = "/login.html";
    return;
}

const resultado = await resposta.json();

if (!resposta.ok || !resultado.sucesso) {

    throw new Error(
        resultado.mensagem || "Erro ao carregar agendamentos."
    );

}

                    const resultado =
                        await resposta.json();

                    if (!resposta.ok || !resultado.sucesso) {
                        erro.style.display = "block";
                        return;
                    }

                    window.location.href = "/admin";

                } catch (e) {

                    erro.textContent =
                        "Erro ao conectar ao servidor.";

                    erro.style.display = "block";
                }

            });

    </script>

</body>
</html>
